# Experiment 12 — Rombach-style first-stage autoencoder
# Architecture: UNet-style (GroupNorm ResBlocks + attention) with KL or VQ regularization
# Based on: Rombach et al., "High-Resolution Image Synthesis with Latent Diffusion Models"
#           CVPR 2022  https://arxiv.org/abs/2112.10752
#
# Config reflects paper's best f=8 settings (Table 1):
#   KL:  z_channels=4, R-FID=0.90
#   VQ:  n_embed=16384, embed_dim=4
#
# To switch to VQ mode:
#   - set model.ae_conf.regulation: vq
#   - set model.loss_type: mse+vq+spectral+gradient (remove kl)
#
# This AE will be frozen and used as the first stage of a latent diffusion model.
_experiment_name: "12-rombach-ae"
_run_name: "vq_f8_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'       # 10m wind speed — derived diagnostic
      normalization: z-score
      loss_weight: 1.0

    - name: '10u'        # 10m U wind component
      normalization: z-score
      loss_weight: 1.0

    - name: '10v'        # 10m V wind component
      normalization: z-score
      loss_weight: 1.0

    - name: '2d'         # 2m dewpoint temperature
      normalization: z-score
      loss_weight: 1.0

    - name: '2t'         # 2m temperature
      normalization: z-score
      loss_weight: 1.0

    - name: 'cbh'        # cloud base height
      normalization: z-score
      loss_weight: 1.0

    - name: 'hcc'        # high cloud cover
      normalization: none
      loss_weight: 1.0

    - name: 'lcc'        # low cloud cover
      normalization: none
      loss_weight: 1.0

    - name: 'lsm'        # land-sea mask (static forcing — excluded from loss)
      normalization: none
      loss_weight: null

    - name: 'mcc'        # medium cloud cover
      normalization: none
      loss_weight: 1.0

    - name: 'sp'         # surface pressure
      normalization: z-score
      loss_weight: 1.0

    - name: 't_850'      # temperature at 850 hPa
      normalization: z-score
      loss_weight: 1.0

    - name: 'tcc'        # total cloud cover
      normalization: none
      loss_weight: 1.0

    - name: 'tcw'        # total column water
      normalization: std
      loss_weight: 1.0

    - name: 'tp'         # total precipitation
      normalization: std
      loss_weight: 1.0

    - name: 'u_850'      # U wind at 850 hPa
      normalization: z-score
      loss_weight: 1.0

    - name: 'v_850'      # V wind at 850 hPa
      normalization: z-score
      loss_weight: 1.0

    - name: 'w_850'      # vertical velocity at 850 hPa
      normalization: z-score
      loss_weight: 1.0

    - name: 'q_850'      # specific humidity at 850 hPa
      normalization: std
      loss_weight: 1.0

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.RombachAEModel
  # ── Regularization + loss ────────────────────────────────────────────────────
  # KL mode: 'mse+kl' or 'mse+kl+spectral+gradient'
  # VQ mode: 'mse+vq' or 'mse+vq+spectral+gradient'
  loss_type: "mse+kl+spectral+gradient"
  # KL parameters (KL mode only)
  kl_weight: 1.0e-6         # paper recommends ~1e-6; small enough to not dominate MSE
  kl_warmup_steps: 10000    # linear ramp from 0 → kl_weight over first 10k steps
  # VQ parameters (VQ mode only, ignored when regulation=kl)
  vq_loss_weight: 1.0       # multiplier on the combined VQ loss term
  # Physics-informed losses
  spectral_weight: 0.1      # FFT amplitude spectrum penalty
  gradient_weight: 0.1      # finite-difference spatial gradient penalty
  # ── Network ───────────────────────────────────────────────────────────────────
  ae_conf:
    _target_: dssml.networks.ae.RombachAutoEncoder
    in_channels: 19                     # one channel per MEPS variable (T=1, E=1)
    # ── Compression factor f=8 → 256×256 → 32×32 latent ──────────────────────
    # ch_mult=(1,2,4,4): 3 stride-2 downsamples → 256→128→64→32
    ch: 128
    ch_mult: [1, 2, 4, 4]
    num_res_blocks: 2
    # Attention at 32×32 bottleneck (correct for f=8; paper default 16px is for f=16)
    attn_resolutions: [32]
    resolution: 256
    dropout: 0.0
    resamp_with_conv: true
    # ── Latent space ─────────────────────────────────────────────────────────
    # Paper Table 1 best KL f=8: z_channels=4, R-FID=0.90
    z_channels: 4
    embed_dim: 4            # set equal to z_channels (no bottleneck compression)
    # ── Regularization mode ──────────────────────────────────────────────────
    # 'kl': continuous latent (DiagonalGaussian posterior)
    # 'vq': discrete codebook (VectorQuantizer, straight-through estimator)
    regulation: kl
    # VQ settings (used only when regulation=vq; paper Table 1 best VQ f=8):
    n_embed: 16384          # codebook size
    vq_beta: 0.25           # commitment loss coefficient
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
