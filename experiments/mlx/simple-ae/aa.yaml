normalizer:
  _target_: dssml.data.helpers.normalizers.SymRangeNormalizer
  norm_const: 1.0
  eps: 1e-6



datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 8
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4


model:
  _target_: dssml.models.ae.SimpleAutoEncoderModel
  auto_encoder_conf:
    _target_: dssml.networks.ae.AutoEncoderAA
    input_channels: 22
    latent_dim: 64
  # Shared between all models inherited from ModelBase
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.AdamW
        lr: 5.0e-5
        weight_decay: 1.0e-4
      scheduler:
        _target_: torch.optim.lr_scheduler.ExponentialLR
        gamma: 0.9999

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t","10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr


  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: -1
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints

  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  # tags:
  #   project: "diffusion_interpolation"
  synchronous: false



