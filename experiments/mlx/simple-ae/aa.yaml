_experiment_name: "simple-ae"
_run_name: "test_aa_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
## 
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

 
_target_: dssml.runners.DefaultTrainer
resume: false
plfit:
  ckpt_path:
pltrainer:
  accelerator: gpu
  enable_checkpointing: true
  devices: auto #  4 for ddp_spawn and 1 for ddp
  strategy: ddp # single_device #ddp
  precision: 32-true   # 32-true #bf16-mixed # TODO: implement mixed precision
  max_epochs: 101
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1 
  accumulate_grad_batches: 1  # Effective batch size = per_gpu_batch_size * accumulate_grad_batches * num_gpus * num_nodes.
  gradient_clip_val: 1.0 # If the norm of all gradients exceeds 1.0, scale them down so the norm = 1.0. This keeps updates stable (common in RNNs, transformers, unstable optimizers).
  enable_progress_bar: false
  profiler: simple



manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
       31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973,
       31974, 31975, 31976, 31977, 31978, 31979, 31980, 31981, 31982,
       31983, 31984, 31985, 31986, 31987, 31988, 31989, 31990, 31991]

  variables: 
    - '10si'
    - '10u'
    - '10v'
    - '2d'
    - '2t'
    - 'cbh'
    - 'hcc'
    - 'lcc'
    - 'lsm'
    - 'mcc'
    - 'sp'
    - 't_850'
    - 'tcc'
    - 'tcw'
    - 'tp'
    - 'u_850'
    - 'v_850'
    - 'w_850'
    - 'q_850'
    - 'z'
