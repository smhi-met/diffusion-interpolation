# LoLA DCAE — experiment 10: arcsinh saturation + 64 latent channels
#
# Architecture:  LoLAAutoEncoder (DCEncoder → LoLASaturation → DCDecoder)
# Saturation:    arcsinh  —  z → arcsinh(z)  [UNBOUNDED, sub-linear for |z|≫1]
# Loss:          mae + vmse  (L1 sharpness + variance-normalised fidelity)
# Compression:   256×256 → 16×16  (16×)
# Latent depth:  64 channels
# Loss weights:  physics-motivated (same as exp 03)
#
# EXTREME VALUE CONFIG 2 — Unbounded latent saturation to preserve extremes
#
# Physical motivation:
#   The default softclip2 saturation bounds the latent to (-5, +5).
#   During extreme weather events (record-breaking temperature anomalies,
#   deep pressure minima of mid-latitude cyclones, convective updrafts),
#   the true latent code may want to reach |z| >> 5.  With softclip2 the
#   encoder saturates: the latent cannot distinguish "very extreme" from
#   "moderately extreme", so the decoder loses the ability to reconstruct
#   the full depth of those events.
#
#   arcsinh(z) ≈ z for |z|<<1 (linear, gradient=1 near origin), and
#                ≈ ±ln(2|z|) for |z|>>1 (sub-linear, but UNBOUNDED).
#   This allows the encoder to place extreme-event codes arbitrarily far
#   from the origin while still discouraging unbounded growth via the
#   sub-linear slope.
#
#   64 latent channels (vs 32) provides additional capacity to simultaneously
#   encode extreme spatial gradients (frontal zones, orographic precipitation)
#   and background state — critical for reconstructing the contrast between
#   extreme and ordinary conditions.
#
#   mae+vmse loss:
#     vmse: auto-normalises each variable by its spatial variance → robust to
#           the large dynamic range of extreme events.
#     mae (L1): sparser gradients, sharper reconstruction at boundaries and
#               discontinuities (fronts, coastlines) — more physically faithful
#               than MSE which blurs edges.
#
# Trade-off: unbounded latent is harder for the downstream diffusion model
#   to learn (no natural scale).  Evaluate reconstruction quality and latent
#   distribution before training the diffusion stage.
#
# Constraint check for 64 latent channels with DC-AE §3.1:
#   ChannelAveragingResidualConv(384, 64): 384 % 64 == 0 (384/64=6) ✓
#   ChannelDuplicatingResidualConv(64, 384): 384 % 64 == 0 ✓
#
# Compare with:
#   03-lola-no-norm — softclip2 saturation, 32 latent channels (baseline)
#   08-lola-z64     — softclip2 saturation, 64 channels (isolates saturation effect)

_experiment_name: "10-arcsinh-z64"
_run_name: "arcsinh_z64_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'
      normalization: z-score
      loss_weight: 0.5

    - name: '10u'
      normalization: z-score
      loss_weight: 0.5

    - name: '10v'
      normalization: z-score
      loss_weight: 0.5

    - name: '2d'
      normalization: z-score
      loss_weight: 0.5

    - name: '2t'
      normalization: z-score
      loss_weight: 1.0

    - name: 'cbh'
      normalization: z-score
      loss_weight: 0.1

    - name: 'hcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lsm'
      normalization: none
      loss_weight: null

    - name: 'mcc'
      normalization: none
      loss_weight: 0.1

    - name: 'sp'
      normalization: z-score
      loss_weight: 10.0

    - name: 't_850'
      normalization: z-score
      loss_weight: 6.0

    - name: 'tcc'
      normalization: none
      loss_weight: 0.1

    - name: 'tcw'
      normalization: std
      loss_weight: 1.0

    - name: 'tp'
      normalization: std
      loss_weight: 0.025

    - name: 'u_850'
      normalization: z-score
      loss_weight: 0.8

    - name: 'v_850'
      normalization: z-score
      loss_weight: 0.5

    - name: 'w_850'
      normalization: z-score
      loss_weight: 0.1

    - name: 'q_850'
      normalization: std
      loss_weight: 0.6

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.LoLADCAEModel
  # mae+vmse: L1 sharpens fronts/edges; vmse normalises the scale of extreme events
  loss_type: "mae+vmse"
  vmse_weight: 1.0
  l1_weight: 0.5
  l2_weight: 1.0
  vrmse_weight: 1.0
  noise_std: 0.0
  ae_conf:
    _target_: dssml.networks.ae.LoLAAutoEncoder
    in_channels: 19
    latent_channels: 64                  # 2× capacity for extreme-value encoding
    hid_channels: [96, 192, 384, 384]
    hid_blocks: [2, 2, 2, 2]
    patch_size: 2
    stride: 2
    saturation_mode: "arcsinh"           # unbounded: z → arcsinh(z)
    saturation_bound: 5.0                # unused in arcsinh mode; kept for API compat
    attn_levels: [2]
    dropout: 0.0
    identity_init: true
    residual_autoencoding: true
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
