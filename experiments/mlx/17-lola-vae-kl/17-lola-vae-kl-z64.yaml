# Variational LoLA autoencoder — KL regularization, z=64×16×16
#
# Based on:  08-lola-z64  (deterministic LoLA DCAE)
# Change:    LoLADCAEModel → LoLAVAEModel + LoLAVariationalAutoEncoder + KL
#
# Goal: enforce zero-mean latents via KL(q(z|x) ‖ N(0,I)) while keeping
# the vmse reconstruction loss from the LoLA paper (variance-normalised MSE).
# kl_weight=1e-4 is conservative — same as QRL variational experiments.
#
# Architecture: same DC-AE backbone as exp 08 (z=64, 4 levels, 16×16 spatial)
# Latent tensor: (B, 64, 16, 16) = 16384 values per sample
#
# LoLASaturation bounds μ to (−5, +5); logvar is unconstrained.
# At inference encode(x) returns μ (deterministic).
#
# Compare with:
#   08-lola-z64              — deterministic counterpart (no KL)
#   17-lola-vae-kl-mmd-z64  — adds MMD on top of KL (same folder)
#   15-qrl-vae-winds-kl-z64 — QRL loss variant with KL

_experiment_name: "17-lola-vae-kl"
_run_name: "17-lola-vae-kl-z64-${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'
      normalization: z-score
      loss_weight: 0.5

    - name: '10u'
      normalization: z-score
      loss_weight: 0.5

    - name: '10v'
      normalization: z-score
      loss_weight: 0.5

    - name: '2d'
      normalization: z-score
      loss_weight: 0.5

    - name: '2t'
      normalization: z-score
      loss_weight: 1.0

    - name: 'cbh'
      normalization: z-score
      loss_weight: 0.1

    - name: 'hcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lsm'
      normalization: none
      loss_weight: null

    - name: 'mcc'
      normalization: none
      loss_weight: 0.1

    - name: 'sp'
      normalization: z-score
      loss_weight: 10.0

    - name: 't_850'
      normalization: z-score
      loss_weight: 6.0

    - name: 'tcc'
      normalization: none
      loss_weight: 0.1

    - name: 'tcw'
      normalization: std
      loss_weight: 1.0

    - name: 'tp'
      normalization: std
      loss_weight: 0.025

    - name: 'u_850'
      normalization: z-score
      loss_weight: 0.8

    - name: 'v_850'
      normalization: z-score
      loss_weight: 0.5

    - name: 'w_850'
      normalization: z-score
      loss_weight: 0.1

    - name: 'q_850'
      normalization: std
      loss_weight: 0.6

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.LoLAVAEModel
  loss_type: "vmse"
  reg_type: "kl"
  kl_weight: 1.0e-04
  vmse_weight: 1.0
  ae_conf:
    _target_: dssml.networks.ae.LoLAVariationalAutoEncoder
    in_channels: 19
    latent_channels: 64
    hid_channels: [96, 192, 384, 384]
    hid_blocks: [2, 2, 2, 2]
    patch_size: 2
    stride: 2
    saturation_mode: "softclip2"
    saturation_bound: 5.0
    attn_levels: [2]
    dropout: 0.0
    identity_init: true
    residual_autoencoding: true
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
