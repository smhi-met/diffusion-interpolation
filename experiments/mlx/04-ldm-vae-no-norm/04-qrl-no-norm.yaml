# QRL autoencoder — experiment 04
#
# Architecture:  QRLAutoEncoder (DCEncoder → LoLASaturation → DCDecoder)
# Saturation:    z → z / √(1 + z²/B²)  (softclip2, B=5)
# Loss:          mse + wqrl + fl_hist  (Approaches 1 & 2 combined)
# Compression:   256×256 → 16×16  (16×, via patch_size=2 + 3 × stride-2 downs)
# Variables:     19-channel set with physics-motivated loss_weights from exp 03.
#
# Paper: "Quantizing reconstruction losses for improving weather data synthesis"
#         Nature Scientific Reports, 2024 (doi:10.1038/s41598-024-52773-2)
#
# Differences from 03-lola-no-norm:
#   - loss_type: mse+wqrl+fl_hist  (distribution-aware; targets extreme events)
#   - model class: QRLDCAEModel  (new; adds quantized and focal loss terms)
#   - network class: QRLAutoEncoder  (new; same architecture as LoLAAutoEncoder)
#   - focal_scale: 100.0  (paper default λ; scales focal terms to match MSE magnitude)
#   - fl_beta: 0.2, fl_gamma: 1.0, n_bins: 100  (all paper defaults)
#
# Loss breakdown:
#   MSE    — standard fidelity baseline; ensures well-reconstructed common values
#   WQRL   — upweights rare value bins (ω_j = 1 − h_j); forces model to handle extremes
#   FL_hist — per-pixel focal weight from histogram; rare target values get stronger gradient
#
# To ablate approaches individually, set loss_type to:
#   "mse"          — baseline (same as exp 02)
#   "mse+wqrl"     — Approach 1 only
#   "mse+fl_hist"  — Approach 2 only
#   "mse+qrl"      — Approach 1, uniform variant (no rarity weighting)
#   "mse+fl_mse"   — Approach 2, sigmoid-modulated variant

_experiment_name: "04-qrl-no-norm"
_run_name: "qrl_dcae_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'        # 10m wind speed — derived diagnostic
      normalization: z-score
      loss_weight: 0.5

    - name: '10u'         # 10m U wind component
      normalization: z-score
      loss_weight: 0.5

    - name: '10v'         # 10m V wind component
      normalization: z-score
      loss_weight: 0.5

    - name: '2d'          # 2m dewpoint temperature
      normalization: z-score
      loss_weight: 0.5

    - name: '2t'          # 2m temperature
      normalization: z-score
      loss_weight: 1.0

    - name: 'cbh'         # cloud base height
      normalization: z-score
      loss_weight: 0.1

    - name: 'hcc'         # high cloud cover
      normalization: none
      loss_weight: 0.1

    - name: 'lcc'         # low cloud cover
      normalization: none
      loss_weight: 0.1

    - name: 'lsm'         # land-sea mask — static forcing, input only, no loss
      normalization: none
      loss_weight: null

    - name: 'mcc'         # medium cloud cover
      normalization: none
      loss_weight: 0.1

    - name: 'sp'          # surface pressure — high priority
      normalization: z-score
      loss_weight: 10.0

    - name: 't_850'       # temperature at 850 hPa
      normalization: z-score
      loss_weight: 6.0

    - name: 'tcc'         # total cloud cover
      normalization: none
      loss_weight: 0.1

    - name: 'tcw'         # total column water
      normalization: std
      loss_weight: 1.0

    - name: 'tp'          # total precipitation — distribution-aware loss targets this
      normalization: std
      loss_weight: 0.025

    - name: 'u_850'       # U wind at 850 hPa
      normalization: z-score
      loss_weight: 0.8

    - name: 'v_850'       # V wind at 850 hPa
      normalization: z-score
      loss_weight: 0.5

    - name: 'w_850'       # vertical velocity at 850 hPa — noisy, small scale
      normalization: z-score
      loss_weight: 0.1

    - name: 'q_850'       # specific humidity at 850 hPa
      normalization: std
      loss_weight: 0.6

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.QRLDCAEModel
  # ── Loss ──────────────────────────────────────────────────────────────────
  # Combined loss: MSE + WQRL (Approach 1) + FL_hist (Approach 2)
  #
  # Approach 1: quantized reconstruction losses
  #   mse    — plain MSE baseline term
  #   wqrl   — weighted quantized: bins with rare values get ω_j = 1 − h_j weight
  #
  # Approach 2: reconstruction focal losses
  #   fl_hist — ω_j^γ · (x − x̂)²  [histogram-based focal modulation]
  #   fl_mse  — σ(β|x − x̂|)^γ · (x − x̂)²  [sigmoid error-based modulation]
  #
  # To switch to individual approaches, change loss_type to e.g.:
  #   "mse+wqrl"    — Approach 1 only
  #   "mse+fl_hist" — Approach 2 only
  #   "mse+qrl"     — Approach 1 uniform (no rarity weighting)
  loss_type: "mse+wqrl+fl_hist"
  # ── Loss term weights ──────────────────────────────────────────────────────
  mse_weight: 1.0
  qrl_weight: 1.0
  wqrl_weight: 1.0
  fl_mse_weight: 1.0
  fl_hist_weight: 1.0
  # ── Histogram parameters ───────────────────────────────────────────────────
  # n_bins: number of histogram bins per channel per batch (paper: 100)
  # Bins are computed dynamically from each mini-batch (per-channel, per-batch).
  n_bins: 100
  # ── Focal loss parameters (paper defaults) ─────────────────────────────────
  fl_beta: 0.2           # β  in FL_MSE sigmoid modulation
  fl_gamma: 1.0          # γ  exponent for both focal losses
  focal_scale: 100.0     # λ  scales focal terms to match MSE magnitude
  # ── Latent noise (training regularisation) ────────────────────────────────
  # Adds Gaussian noise to z during training to smooth the latent manifold.
  # Start with 0; increase to 0.05–0.1 if downstream diffusion training
  # shows latent discontinuities or artefacts.
  noise_std: 0.0
  # ── Network ───────────────────────────────────────────────────────────────
  ae_conf:
    _target_: dssml.networks.ae.QRLAutoEncoder
    in_channels: 19                       # one channel per variable (lsm included)
    latent_channels: 32                   # latent depth
    # Spatial compression: 256 → 16  (16×) via patch_size=2 + 3 × stride-2 downs
    hid_channels: [96, 192, 384, 384]     # feature widths per level
    hid_blocks: [2, 2, 2, 2]             # DCResBlocks per level
    patch_size: 2                         # initial pixel-unshuffle factor
    stride: 2                             # inter-level pixel-unshuffle factor
    # Latent saturation: z → z / √(1 + z²/B²)
    saturation_mode: "softclip2"          # LoLA/DC-AE default
    saturation_bound: 5.0                 # B=5, output range ≈ (−5, +5)
    # Attention at level 2 → spatial resolution 32×32 (after 2 downs)
    attn_levels: [2]
    dropout: 0.0
    identity_init: true                   # near-identity init for pixel-shuffle convs
    residual_autoencoding: true           # DC-AE §3.1 shortcuts (recommended)
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
