_experiment_name: "simple-conv-ae"
_run_name: "test_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_reduced_rechu.zarr"
## 
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

 
_target_: dssml.runners.DefaultTrainer
resume: false
plfit:
  ckpt_path:
pltrainer:
  accelerator: gpu
  enable_checkpointing: true
  devices: auto #  4 for ddp_spawn and 1 for ddp
  strategy: ddp # single_device #ddp
  precision: bf16-mixed # 32-true #bf16-mixed # TODO: implement mixed precision
  max_epochs: 5
  log_every_n_steps: 1
  deterministic: false
  num_nodes: 1 
  accumulate_grad_batches: 1  # Effective batch size = per_gpu_batch_size * accumulate_grad_batches * num_gpus * num_nodes.
  gradient_clip_val: 1.0 # If the norm of all gradients exceeds 1.0, scale them down so the norm = 1.0. This keeps updates stable (common in RNNs, transformers, unstable optimizers).
  enable_progress_bar: true



manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  #variables: ['10u','10v','2t']
  reshape_to: [256,256] 
  splits:
    type: date_based
    periods:
    - train:
        start: "2020-02-06"
        end: "2020-02-28"
      val:
        start: "2020-02-29"
        end: "2020-03-03"
      test:
        start: "2020-03-04"
        end: "2020-03-08"
    - train:
        start: "2020-03-09"
        end: "2020-03-29"
      val:
        start: "2020-03-30"         
        end: "2020-04-03"
      test:
        start: "2020-04-04"
        end: "2020-04-08"


normalizer:
  _target_: dssml.data.helpers.normalizers.SymRangeNormalizer
  norm_const: 1.0
  eps: 1e-6



datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 8
    num_workers: 8
    pin_memory: true



model:
  _target_: dssml.models.ae.SimpleAutoEncoderModel
  auto_encoder_conf:
    _target_: dssml.networks.ae.SimpleAutoEncoder
    input_channels: 28
    latent_dim: 64
  # Shared between all models inherited from ModelBase
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.AdamW
        lr: 5.0e-5
        weight_decay: 1.0e-4
      scheduler:
        _target_: torch.optim.lr_scheduler.ExponentialLR
        gamma: 0.9999


callbacks:
  - _target_: dssml.callbacks.meps.ae.SimpleAEOutput
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch}-{val_loss:.3f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  # tags:
  #   project: "diffusion_interpolation"
  synchronous: false



