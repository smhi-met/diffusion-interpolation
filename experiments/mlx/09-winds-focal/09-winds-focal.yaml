# QRL DCAE — experiment 09: winds/precip-focused distribution-aware losses
#
# Architecture:  QRLAutoEncoder (DCEncoder → LoLASaturation → DCDecoder)
# Saturation:    softclip2, B=5
# Loss:          mse + wqrl + fl_hist  (distribution-aware reconstruction)
# Compression:   256×256 → 16×16  (16×)
# Loss weights:  WINDS + PRECIP FOCUSED (same philosophy as exp 06)
#
# EXTREME VALUE CONFIG 1 — Distribution-aware losses targeting wind storms
# and heavy precipitation extremes.
#
# Physical motivation:
#   The MEPS dataset variables most critical for societal impact (flooding,
#   storm damage, aviation) are 10u/10v/10si (wind) and tp (precipitation).
#   These have highly skewed distributions: tp is >90% near-zero with rare
#   heavy events; extreme wind speeds occupy the high tail of a Weibull dist.
#
#   Standard MSE treats every pixel equally → the bulk of near-zero pixels
#   swamp the gradient signal from extreme events.
#
#   WQRL: bins the value range uniformly; rare extreme bins contribute equally
#          to common bins → forces the model to fit the extreme tails.
#   FL_hist: per-pixel weight ω_j = 1 − h_j (inverse histogram frequency);
#             rare target values receive stronger gradient signal directly.
#
#   Combined with high loss_weights on the primary output variables, this
#   config prioritises accurate reconstruction of wind storms and heavy
#   precipitation episodes — the events that matter most physically.
#
# Loss weights (same as 06-lola-winds; applied on top of WQRL/FL_hist):
#   10si/10u/10v = 3.0  tp = 1.5  2t = 3.0  sp = 8.0  t_850 = 5.0
#
# Compare with:
#   04-qrl-no-norm   — QRL losses, physics weights from exp 03 (not winds-focused)
#   06-lola-winds    — winds-focused weights, vmse loss (no distribution-aware terms)

_experiment_name: "09-winds-focal"
_run_name: "winds_focal_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'        # 10m wind speed — PRIMARY OUTPUT, storm extremes
      normalization: z-score
      loss_weight: 3.0

    - name: '10u'         # 10m U wind — PRIMARY OUTPUT
      normalization: z-score
      loss_weight: 3.0

    - name: '10v'         # 10m V wind — PRIMARY OUTPUT
      normalization: z-score
      loss_weight: 3.0

    - name: '2d'          # 2m dewpoint — humidity, coupled to tp
      normalization: z-score
      loss_weight: 1.0

    - name: '2t'          # 2m temperature — PRIMARY OUTPUT
      normalization: z-score
      loss_weight: 3.0

    - name: 'cbh'         # cloud base height — secondary
      normalization: z-score
      loss_weight: 0.1

    - name: 'hcc'         # high cloud cover — secondary
      normalization: none
      loss_weight: 0.1

    - name: 'lcc'         # low cloud cover — secondary
      normalization: none
      loss_weight: 0.1

    - name: 'lsm'         # land-sea mask — static forcing, no loss
      normalization: none
      loss_weight: null

    - name: 'mcc'         # medium cloud cover — secondary
      normalization: none
      loss_weight: 0.1

    - name: 'sp'          # surface pressure → msl — PRIMARY OUTPUT
      normalization: z-score
      loss_weight: 8.0

    - name: 't_850'       # 850 hPa temperature — drives 2t advection
      normalization: z-score
      loss_weight: 5.0

    - name: 'tcc'         # total cloud cover — secondary
      normalization: none
      loss_weight: 0.1

    - name: 'tcw'         # total column water — precip proxy
      normalization: std
      loss_weight: 1.0

    - name: 'tp'          # total precipitation — PRIMARY OUTPUT, extreme events
      normalization: std
      loss_weight: 1.5

    - name: 'u_850'       # U wind at 850 hPa — wind advection
      normalization: z-score
      loss_weight: 2.0

    - name: 'v_850'       # V wind at 850 hPa — wind advection
      normalization: z-score
      loss_weight: 2.0

    - name: 'w_850'       # vertical velocity — convection indicator
      normalization: z-score
      loss_weight: 0.2

    - name: 'q_850'       # specific humidity — moisture transport
      normalization: std
      loss_weight: 1.0

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.QRLDCAEModel
  # Distribution-aware losses: MSE baseline + WQRL (rare bins) + FL_hist (rare pixels)
  loss_type: "mse+wqrl+fl_hist"
  mse_weight: 1.0
  qrl_weight: 1.0
  wqrl_weight: 1.0
  fl_mse_weight: 1.0
  fl_hist_weight: 1.0
  n_bins: 100
  fl_beta: 0.2
  fl_gamma: 1.0
  focal_scale: 100.0
  noise_std: 0.0
  ae_conf:
    _target_: dssml.networks.ae.QRLAutoEncoder
    in_channels: 19
    latent_channels: 32
    hid_channels: [96, 192, 384, 384]
    hid_blocks: [2, 2, 2, 2]
    patch_size: 2
    stride: 2
    saturation_mode: "softclip2"
    saturation_bound: 5.0
    attn_levels: [2]
    dropout: 0.0
    identity_init: true
    residual_autoencoding: true
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
