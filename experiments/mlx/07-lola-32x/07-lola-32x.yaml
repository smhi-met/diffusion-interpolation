# LoLA DCAE — experiment 07: 32× spatial compression
#
# Architecture:  LoLAAutoEncoder — 5-level encoder/decoder
# Saturation:    softclip2, B=5
# Loss:          vmse  (variance-normalised MSE)
# Compression:   256×256 → 8×8  (32×, patch_size=2 + 4 × stride-2 downs)
# Loss weights:  physics-motivated (same as exp 03)
#
# Purpose: test whether a more aggressive spatial bottleneck (32× vs 16×)
# still preserves enough information for latent diffusion interpolation.
# The downstream SLERP interpolation operates in the latent space, so the
# spatial resolution of the latent directly affects the interpolation quality
# of mesoscale features (fronts, convective cells, orographic precipitation).
#
# Architecture change (5 levels vs 4):
#   project_in:  256×256 → 128×128  (pixel_unshuffle factor=2)
#   level 0:     128×128 → 64×64    (ResBlocks × 2 → down)
#   level 1:     64×64   → 32×32    (ResBlocks × 2 → down)
#   level 2:     32×32   → 16×16    (ResBlocks × 2 + Attn → down)
#   level 3:     16×16   → 8×8      (ResBlocks × 2 → down)   ← new level
#   level 4:     8×8     (deepest, no down)
#   project_out: → (B, 32, 8, 8) latent
#
# Constraint check for DC-AE §3.1 residual shortcuts (all satisfied):
#   ResidualConvPixelUnshuffle(384, 384, factor=2): 384%4=0, 384*4%384=0 ✓
#   ChannelAveragingResidualConv(384, 32): 384%32=0 ✓
#   ChannelDuplicatingResidualConv(32, 384): 384%32=0 ✓
#
# Compare with:
#   03-lola-no-norm — identical except 16× compression (4 levels)
#   08-lola-z64     — 16× compression, 64 latent channels

_experiment_name: "07-lola-32x"
_run_name: "lola_32x_${now:%Y%m%d_%H%M%S}"
_work_dir: ${oc.env:PWD}/_work/${_experiment_name}/${_run_name}
_assets_dir: ${oc.env:PWD}/_assets
_dataset_path: "/mnt/tier1/project/p200177/DE_371_bis/meps-2p5km-2020-2025-1h-v2_subdomain_subvars_rechu.zarr"
_mlflow_tracking_uri: file:./_saved/mlflow

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: INFO
      src:
        level: INFO

_target_: dssml.runners.DefaultTrainer
resume: false

plfit:
  ckpt_path:

pltrainer:
  accelerator: gpu
  devices: auto
  strategy: ddp
  precision: 32-true
  max_epochs: 500
  log_every_n_steps: 50
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  profiler: simple

manifest:
  _target_: dssml.data.helpers.manifests.MepsZarrManifest
  dataset_path: ${_dataset_path}
  indices_to_avoid: [31956, 31957, 31958, 31959, 31960, 31961, 31962, 31963, 31964,
    31965, 31966, 31967, 31968, 31969, 31970, 31971, 31972, 31973, 31974, 31975,
    31976, 31977, 31978, 31979, 31980, 31981, 31982, 31983, 31984, 31985, 31986,
    31987, 31988, 31989, 31990, 31991]
  variables:
    - name: '10si'
      normalization: z-score
      loss_weight: 0.5

    - name: '10u'
      normalization: z-score
      loss_weight: 0.5

    - name: '10v'
      normalization: z-score
      loss_weight: 0.5

    - name: '2d'
      normalization: z-score
      loss_weight: 0.5

    - name: '2t'
      normalization: z-score
      loss_weight: 1.0

    - name: 'cbh'
      normalization: z-score
      loss_weight: 0.1

    - name: 'hcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lcc'
      normalization: none
      loss_weight: 0.1

    - name: 'lsm'
      normalization: none
      loss_weight: null

    - name: 'mcc'
      normalization: none
      loss_weight: 0.1

    - name: 'sp'          # surface pressure — high priority
      normalization: z-score
      loss_weight: 10.0

    - name: 't_850'
      normalization: z-score
      loss_weight: 6.0

    - name: 'tcc'
      normalization: none
      loss_weight: 0.1

    - name: 'tcw'
      normalization: std
      loss_weight: 1.0

    - name: 'tp'
      normalization: std
      loss_weight: 0.025

    - name: 'u_850'
      normalization: z-score
      loss_weight: 0.8

    - name: 'v_850'
      normalization: z-score
      loss_weight: 0.5

    - name: 'w_850'
      normalization: z-score
      loss_weight: 0.1

    - name: 'q_850'
      normalization: std
      loss_weight: 0.6

  reshape_to: [256, 256]
  splits:
    type: date_based
    periods:
      - train:
          start: "2021-01-01"
          end: "2023-12-30"
      - val:
          start: "2024-01-11"
          end: "2024-01-20"
      - val:
          start: "2024-03-11"
          end: "2024-03-20"
      - val:
          start: "2024-05-11"
          end: "2024-05-20"
      - val:
          start: "2024-07-11"
          end: "2024-07-20"
      - val:
          start: "2024-09-11"
          end: "2024-09-20"
      - val:
          start: "2024-11-11"
          end: "2024-11-20"
      - test:
          start: "2020-03-04"
          end: "2020-03-08"

normalizer:
  _target_: dssml.data.helpers.normalizers.MultiNormalizer

datamodule:
  _target_: dssml.data.modules.meps.MEPSZarrWindowDataModule
  dl_kwargs:
    batch_size: 4
    num_workers: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

model:
  _target_: dssml.models.ae.LoLADCAEModel
  loss_type: "vmse"
  vmse_weight: 1.0
  l1_weight: 1.0
  l2_weight: 1.0
  vrmse_weight: 1.0
  noise_std: 0.0
  ae_conf:
    _target_: dssml.networks.ae.LoLAAutoEncoder
    in_channels: 19
    latent_channels: 32
    # 5-level encoder/decoder → 32× spatial compression (256 → 8)
    hid_channels: [96, 192, 384, 384, 384]
    hid_blocks: [2, 2, 2, 2, 2]
    patch_size: 2
    stride: 2
    saturation_mode: "softclip2"
    saturation_bound: 5.0
    attn_levels: [2]    # attention at 32×32 spatial resolution
    dropout: 0.0
    identity_init: true
    residual_autoencoding: true
  optimizers_conf:
    - optimizer:
        _target_: torch.optim.Adam
        lr: 4.5e-06
        betas: [0.9, 0.95]
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 500000
        eta_min: 1.0e-07

callbacks:
  - _target_: dssml.callbacks.meps.ae.LatentSpaceSampler
    variables: ["2t", "10si", "10u", "10v", "tp", "2d"]
    output_path: ${_work_dir}/samples.zarr
    log_interval: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{step:05d}-{val_loss:.4f}"
    dirpath: ${_work_dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0001
    verbose: true

logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: ${_experiment_name}
  run_name: ${_run_name}
  tracking_uri: ${_mlflow_tracking_uri}
  synchronous: false
