[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssml"
version = "0.1.0"
description = "Dynamic Systems Simulation by Machine Learning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "mlflow==3.3.2",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "torchmetrics==1.8.2",
  "tqdm==4.66.5",
  "lightning==2.4",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "pre-commit==4.5.1",
  "xarray==2026.1.0",
  "einops==0.8.2",
  "zarr==3.1.5",
  "pydantic==2.12"
  
]
optional-dependencies.dev = [  "pre-commit>=3.3.3" ]
optional-dependencies.test = [  "pytest>=8.0.0", "pytest-cov>=5.0.0" ]

[tool.setuptools]
# 1. Map the root of your package imports to the 'src' directory
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# 2. Tell the finder to look inside 'src'
where = ["src"]

